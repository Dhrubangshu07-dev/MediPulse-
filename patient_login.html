<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediPulse - Patient Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#005137",
                        "on-secondary-fixed-variant": "#3a485b",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "on-primary": "#ffffff",
                        "surface-container": "#eceef0",
                        "on-surface-variant": "#3d4a42",
                        "outline": "#6d7a72",
                        "tertiary": "#00628d",
                        "inverse-surface": "#2d3133",
                        "surface-variant": "#e0e3e5",
                        "surface-tint": "#006c4a",
                        "surface-dim": "#d8dadc",
                        "primary-fixed-dim": "#68dba9",
                        "primary": "#006948",
                        "secondary": "#515f74",
                        "outline-variant": "#bccac0",
                        "secondary-container": "#d5e3fc",
                        "secondary-fixed-dim": "#b9c7df",
                        "surface-container-highest": "#e0e3e5",
                        "on-background": "#191c1e",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#001e2f",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary-fixed": "#002114",
                        "primary-fixed": "#85f8c4",
                        "tertiary-fixed-dim": "#89ceff",
                        "surface-container-high": "#e6e8ea",
                        "on-primary-container": "#f5fff7",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#007cb1",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-fixed": "#0d1c2e",
                        "tertiary-fixed": "#c9e6ff",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#00855d",
                        "on-surface": "#191c1e",
                        "inverse-primary": "#68dba9",
                        "on-secondary-container": "#57657a",
                        "background": "#f7f9fb",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#fcfcff",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "secondary-fixed": "#d5e3fc",
                        "surface": "#f7f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "lg": "24px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "3xl": "64px",
                        "2xl": "48px"
                    },
                    "fontFamily": {
                        "h1": ["Inter"],
                        "label-sm": ["Inter"],
                        "h3": ["Inter"],
                        "caption": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "h2": ["Inter"],
                        "h1-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "h4": ["Inter"],
                        "display": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h1": ["32px", { "lineHeight": "1.25", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "h3": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "h1-mobile": ["24px", { "lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h4": ["16px", { "lineHeight": "1.5", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .login-bg {
            background-color: #F8FAFC;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .ambient-shadow {
            box-shadow: 0 20px 25px -5px rgba(71, 85, 105, 0.1), 0 8px 10px -6px rgba(71, 85, 105, 0.1);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col justify-between login-bg antialiased text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest shadow-sm w-full z-50 flex justify-between items-center px-lg py-sm max-w-full border-b border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-h2" style="font-variation-settings: 'FILL' 1;">ecg_heart</span>
<span class="font-h3 text-h3 font-bold text-primary">MediPulse</span>
</div>
</header>
<!-- Main Content Canvas (No side/bottom nav for login) -->
<main class="flex-grow flex items-center justify-center p-md md:p-xl">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant ambient-shadow p-xl relative overflow-hidden">
<!-- Decorative accent -->
<div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
<!-- Header -->
<div class="text-center mb-xl mt-sm">
<h1 class="font-h2 text-h2 text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your patient portal</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-sm">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 bg-surface cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Keep me signed in</label>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg shadow-sm transition-all duration-200 active:scale-95 flex justify-center items-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer links -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container font-semibold transition-colors" href="#">Sign up</a>
</p>
</div>
<!-- Trust indicators -->
<div class="mt-xl pt-lg border-t border-outline-variant flex items-center justify-center gap-md">
<div class="flex items-center gap-xs text-on-surface-variant bg-surface-container-low px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm">Secure Login</span>
</div>
<div class="flex items-center gap-xs text-on-surface-variant bg-surface-container-low px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined text-[16px] text-primary">health_and_safety</span>
<span class="font-label-sm text-label-sm">HIPAA Compliant</span>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full bg-surface-container-high py-xl px-lg flex flex-col md:flex-row justify-between items-center gap-md border-t border-outline-variant">
<div class="text-h4 font-h4 font-bold text-primary">MediPulse</div>
<div class="font-caption text-caption text-on-surface-variant">
            © 2024 MediPulse Healthcare. All rights reserved.
        </div>
<div class="flex gap-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors cursor-pointer" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors cursor-pointer" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors cursor-pointer" href="#">Contact Support</a>
</div>
</footer>
</body></html>
